<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projets — Parlement de la rivière Isère</title>
  <!-- Socle commun des grilles (tokens, clair unique, pagination,
       dropdowns, pastilles) — chargé AVANT les styles propres. -->
  <link rel="stylesheet" href="../common/css/base.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="layout">
    <section class="content" aria-label="Projets">
      <div class="content-header">
        <span id="result-count" class="result-count">— projets</span>
        <div class="toolbar">
          <div class="filters">
            <input
              type="search"
              id="search"
              class="search-input"
              placeholder="Titre, porteur, description…"
              autocomplete="off"
              aria-label="Rechercher dans les projets"
            />
            <div class="dropdown" id="statut-dropdown">
              <button
                type="button"
                id="statut-toggle"
                class="dd-toggle"
                aria-expanded="false"
                aria-haspopup="listbox"
              >
                <span class="dd-pill" id="statut-pill">Tous les statuts</span>
                <span class="dd-caret" aria-hidden="true">▾</span>
              </button>
              <div
                id="statut-menu"
                class="dd-menu"
                role="listbox"
                aria-multiselectable="true"
              ></div>
            </div>
            <div class="dropdown" id="cat-dropdown">
              <button
                type="button"
                id="cat-toggle"
                class="dd-toggle"
                aria-expanded="false"
                aria-haspopup="listbox"
              >
                <span class="dd-pill" id="cat-pill">Toutes les catégories</span>
                <span class="dd-caret" aria-hidden="true">▾</span>
              </button>
              <div
                id="cat-menu"
                class="dd-menu"
                role="listbox"
                aria-multiselectable="true"
              ></div>
            </div>
            <label for="sort-select" class="sort-label">Trier par
              <select id="sort-select">
                <option value="recent" selected>Début le plus récent</option>
                <option value="nom">Titre (A-Z)</option>
                <option value="fin">Fin de projet</option>
              </select>
            </label>
          </div>
          <div class="header-controls">
            <nav id="pagination-top" class="pagination pagination-top" aria-label="Pagination haut"></nav>
            <label for="page-size-select" class="page-size-label">Afficher
              <select id="page-size-select">
                <option value="9">9</option>
                <option value="18">18</option>
                <option value="36">36</option>
                <option value="all">Tout</option>
              </select>
            </label>
          </div>
        </div>
      </div>
      <div id="grid" class="grid">
        <p class="muted center">Chargement des projets…</p>
      </div>
      <nav id="pagination" class="pagination" aria-label="Pagination bas"></nav>
    </section>
  </main>

  <!-- Modale détail (calque médiathèque) -->
  <div id="modal" class="modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-content" role="document">
      <button class="modal-close" type="button" data-close aria-label="Fermer">×</button>
      <span id="modal-statut" class="card-type modal-type"></span>
      <h2 id="modal-title" class="modal-title"></h2>
      <p id="modal-meta-line" class="modal-meta-line"></p>
      <div id="modal-cats" class="modal-tags"></div>
      <div class="modal-section" id="modal-desc-section">
        <h3>Description</h3>
        <p id="modal-description" class="modal-description"></p>
      </div>
      <div class="modal-actions">
        <a id="modal-source" class="btn btn-primary" href="#" target="_blank" rel="noopener">
          Ouvrir le lien du projet
        </a>
      </div>
    </div>
  </div>

  <!-- Socles communs (échappement/dates, recherche floue, pagination, dropdowns) -->
  <script src="../common/js/dom.js"></script>
  <script src="../common/js/search.js"></script>
  <script src="../common/js/pagination.js"></script>
  <script src="../common/js/dropdown.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
